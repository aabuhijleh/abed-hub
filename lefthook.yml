pre-commit:
  jobs:
    # Runs first and alone, since it stages files the checks below read.
    - name: skills-sync
      run: bun run skills:sync --stage

    - group:
        parallel: true
        jobs:
          - name: check
            glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}"
            run: bunx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
            stage_fixed: true

          - name: typecheck
            glob: "*.{ts,tsx,mts,cts}"
            run: bun run typecheck

          - name: test
            glob: "*.{ts,tsx}"
            run: bun test

          - name: skills-lint
            glob: "skills/**"
            run: bun run skills:lint
